name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    # Nightly run against the live demo site to catch regressions/drift.
    - cron: '0 6 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  static-checks:
    name: Lint and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: yarn lint
      - run: yarn typecheck

  e2e:
    name: E2E (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: yarn
      - run: yarn install --frozen-lockfile
      - run: npx playwright install --with-deps ${{ matrix.browser }}
      - run: yarn bddgen
      - run: npx playwright test --project=${{ matrix.browser }}
      - name: Generate Cucumber HTML report
        if: ${{ !cancelled() }}
        run: yarn report:cucumber
      - name: Upload reports
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: reports-${{ matrix.browser }}
          path: |
            playwright-report/
            cucumber-report/html/
          retention-days: 14

  publish-report:
    name: Publish report to GitHub Pages
    needs: e2e
    if: ${{ !cancelled() && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: reports-chromium
          path: site
      - name: Arrange site
        run: |
          mv site/cucumber-report/html site/cucumber
          rm -rf site/cucumber-report
          mv site/playwright-report site/playwright
          cat > site/index.html <<'HTML'
          <!doctype html>
          <meta charset="utf-8">
          <title>Playwright BDD test reports</title>
          <h1>Latest test reports (main, Chromium)</h1>
          <ul>
            <li><a href="cucumber/index.html">Cucumber BDD report</a></li>
            <li><a href="playwright/index.html">Playwright HTML report (with traces for failures)</a></li>
          </ul>
          HTML
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
