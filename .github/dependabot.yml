version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    groups:
      # One PR for routine minor/patch bumps instead of one per package.
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Keep Node type definitions on the same major version as the runtime in .nvmrc.
      - dependency-name: '@types/node'
        update-types: [version-update:semver-major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
